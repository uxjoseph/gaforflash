            color: white;
            padding: 18px 24px;
            display: flex;

        .header .stats { font-size: 13px; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; }

            background: white;

            border-right: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .filter-bar {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .filter-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        .filter-btn {
            padding: 5px 12px;
            border: 1px solid #ddd;
            border-radius: 16px;
            background: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }
        .filter-btn:hover { border-color: #1a237e; color: #1a237e; }
        .filter-btn.active { background: #1a237e; color: white; border-color: #1a237e; }

        .complex-list { padding: 8px; }

        .complex-card {
            padding: 14px 16px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .complex-card.active { border-color: #1a237e; background: #e8eaf6; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .card-name { font-size: 15px; font-weight: 700; color: #1a237e; }
        .card-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-top { background: #fff3e0; color: #e65100; }
        .badge-rising { background: #e8f5e9; color: #2e7d32; }
        .badge-value { background: #e3f2fd; color: #1565c0; }
        .badge-new { background: #fce4ec; color: #c62828; }
        .badge-stable { background: #f3e5f5; color: #6a1b9a; }

        .card-location { font-size: 12px; color: #888; margin-bottom: 6px; }
        .card-details { display: flex; gap: 12px; flex-wrap: wrap; }
        .card-detail { font-size: 12px; color: #555; }
        .card-detail strong { color: #333; }
        .card-price { font-size: 13px; font-weight: 700; color: #d32f2f; margin-top: 6px; }

        #map { flex: 1; }

        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .custom-popup .leaflet-popup-content { margin: 14px 16px; min-width: 240px; }
        .popup-title { font-size: 16px; font-weight: 700; color: #1a237e; margin-bottom: 8px; }
        .popup-info { font-size: 13px; color: #555; line-height: 1.8; }
        .popup-info strong { color: #333; }
        .popup-price { font-size: 15px; font-weight: 700; color: #d32f2f; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
        .popup-reason { font-size: 12px; color: #1a237e; background: #e8eaf6; padding: 8px 10px; border-radius: 6px; margin-top: 8px; line-height: 1.5; }

            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 12px;

        .legend i { width: 14px; height: 14px; display: inline-block; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

            border:3px solid white;
            box-shadow:0 2px 6px rgba(0,0,0,0.3);
            display:flex; align-items:center; justify-content:center;
            color:white; font-size:11px; font-weight:700;
        ">${idx+1}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -18]
    });

    const marker = L.marker([c.lat, c.lng], { icon }).addTo(map);
    marker.bindPopup(`
        <div class="popup-title">${c.name}</div>
        <div class="popup-info">
            <strong>주소:</strong> ${c.address}<br>
            <strong>준공:</strong> ${c.built}년 | <strong>세대수:</strong> ${c.units.toLocaleString()}세대<br>
            <strong>규모:</strong> ${c.floors} | <strong>면적:</strong> ${c.area}<br>
            <strong>시공사:</strong> ${c.developer}
        </div>
        <div class="popup-price">${c.price}</div>
        <div class="popup-reason">${c.reason}</div>
    `, { className: 'custom-popup', maxWidth: 300 });

    markers[idx] = marker;
});

// 사이드바 카드 렌더링
function renderList(filter) {
    const list = document.getElementById('complexList');
    list.innerHTML = '';

    const filtered = complexes.filter(c => {
        if (filter === 'all') return true;
        if (filter === '기타') return !['강남','서초','송파','마포','성동'].includes(c.district);
        return c.district === filter;
    });

    document.getElementById('statsDisplay').textContent = `총 ${filtered.length}개 단지`;

    filtered.forEach((c, i) => {
        const idx = complexes.indexOf(c);
        const badgeClass = {top:'badge-top', rising:'badge-rising', value:'badge-value', new:'badge-new', stable:'badge-stable'}[c.badge];
        const card = document.createElement('div');
        card.className = 'complex-card';
        card.innerHTML = `
            <div class="card-header">
                <span class="card-name">${idx+1}. ${c.name}</span>
                <span class="card-badge ${badgeClass}">${c.badgeText}</span>
            </div>
            <div class="card-location">${c.address}</div>
            <div class="card-details">
                <span class="card-detail"><strong>준공</strong> ${c.built}년</span>
                <span class="card-detail"><strong>세대</strong> ${c.units.toLocaleString()}</span>
                <span class="card-detail"><strong>면적</strong> ${c.area}</span>
            </div>
            <div class="card-price">${c.price}</div>
        `;
        card.addEventListener('click', () => {
            document.querySelectorAll('.complex-card').forEach(el => el.classList.remove('active'));
            card.classList.add('active');
            map.flyTo([c.lat, c.lng], 15, { duration: 0.8 });
            markers[idx].openPopup();
        });
        list.appendChild(card);
    });
}

// 필터 버튼 이벤트
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList(btn.dataset.filter);
    });
});

// 초기 렌더링
renderList('all');
</script>

</body>
</html>
